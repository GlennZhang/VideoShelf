<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频总结 · VideoShelf</title><link rel="icon" href="/static/icons/favicon.ico"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/courses.css"><link rel="stylesheet" href="/static/summaries.css"></head>
<body class="courses-page summary-page"><header><nav><a href="/"><img src="/static/icons/favicon-32.png" width="24" height="24" alt="">VideoShelf</a><a href="/static/courses.html">课程教程</a><a href="/static/dramas.html">短剧拆解</a><a href="/static/downloads.html">B 站下载</a><a href="/static/model-settings.html" target="_blank" rel="noopener">模型设置</a></nav><h1>视频总结</h1><p>任意教程视频一键生成学习笔记（分章节、时间码、截图）与优化文稿。</p></header>
<main><form id="summary-import"><label for="summary-path">本机教程视频文件</label><div class="import-row"><input id="summary-path" required placeholder="/Users/你的用户名/视频/教程.mp4"><button class="primary" id="create-summary" type="submit">生成总结</button></div><p>支持 MP4、MKV、MOV。默认均匀采样关键帧插入笔记；<label class="inline-check"><input type="checkbox" id="summary-frames" checked>包含截图</label>取消后仅按语音转写总结。语音转写与识别模型使用<a href="/static/model-settings.html" target="_blank" rel="noopener">模型设置</a>中的配置。</p></form>
<p id="summary-message" role="status" aria-live="polite"></p>
<div class="drama-layout"><aside class="drama-library" aria-label="总结列表"><h2>我的总结</h2><div id="summary-list">正在加载…</div></aside>
<section id="summary-detail" aria-label="总结详情"><h2>选择一条总结</h2><p>提交视频后，这里会显示处理进度、学习笔记和优化稿。</p></section></div></main>
<dialog id="delete-summary-dialog" aria-labelledby="delete-summary-heading"><h2 id="delete-summary-heading">删除这条总结？</h2><p id="delete-summary-title"></p><p>将删除总结记录、笔记、优化稿、截图和缓存。原视频保留，此操作无法撤销。</p><p id="delete-summary-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-delete-summary">取消</button><button type="button" id="confirm-delete-summary">删除总结</button></div></dialog>
<script src="/static/course-editor.bundle.js"></script><script src="/static/summaries.js"></script></body></html>
